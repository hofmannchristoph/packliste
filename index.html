<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Packliste</title>
    <meta name="description" content="Packliste, die sich aus Reiseart, Nächten, Jahreszeit und Aktivitäten selbst zusammenstellt." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Packliste" />
    <!--
      Content-Security-Policy.

      Die App baut ihre Oberfläche durchgehend mit innerHTML und lädt Daten von
      einem Server, dessen Adresse der Nutzer selbst einträgt. Ohne diese Zeile
      wäre eingeschleuster Code durch nichts begrenzt und könnte Daten an eine
      beliebige Adresse schicken. `connect-src` bleibt darum weit genug für
      Supabase (https und wss), alles Ausführbare kommt aber nur von hier.

      `style-src` erlaubt bewusst `unsafe-inline`: Fortschrittsbalken, Sheet-
      Position und Spaltenbreiten werden im Markup gesetzt. Das ist die
      schwächste der Regeln, aber die wertvollen bleiben streng - eingeschleustes
      Skript läuft nicht, und ein Formular oder eine geänderte Basis-Adresse
      kann nichts abfliessen lassen.

      Als Meta-Element gesetzt, weil GitHub Pages keine eigenen Kopfzeilen
      erlaubt. `frame-ancestors` und `report-uri` wirken so nicht - dafür
      bräuchte es einen echten HTTP-Header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self' https: wss:;
               font-src 'self';
               object-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="topbar-row">
          <button class="trip-switch" id="tripSwitch" type="button">
            <h1 class="trip-name" id="topTripName">Reisen</h1>
            <span class="trip-sub" id="topTripSub">Familie Hofmann</span>
          </button>
          <button class="icon-btn" id="btnSync" type="button" title="Sync">
            <span class="visually-hidden" id="syncText">Sync</span>
          </button>
        </div>
        <div class="progress" id="progressWrap">
          <span class="progress-bar"><span class="progress-fill" id="progressFill"></span></span>
          <span class="progress-text" id="progressText">0 / 0</span>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav class="tabbar" aria-label="Bereiche">
        <button class="tab is-active" data-tab="reisen" type="button" aria-current="page"><span class="tab-ico"></span>Reisen</button>
        <button class="tab" data-tab="liste" type="button"><span class="tab-ico"></span>Liste</button>
        <button class="tab" data-tab="reise" type="button"><span class="tab-ico"></span>Angaben</button>
        <button class="tab" data-tab="stamm" type="button"><span class="tab-ico"></span>Stammliste</button>
      </nav>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
